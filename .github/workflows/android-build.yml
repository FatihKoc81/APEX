name: APEX Android APK
on:
  push:
    branches: [main, apex/free-multi-provider]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable signing key
        working-directory: android
        run: |
          base64 -d nexora-debug.keystore.b64 > app/nexora-debug.keystore
      - name: Generate APEX launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            mkdir -p android/app/src/main/res/mipmap-$1
            convert -background none -density 300 android/apex-logo.svg -resize $2x$2 android/app/src/main/res/mipmap-$1/ic_launcher.png
          done
      - name: Generate APEX in-app logo
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          convert -background none -density 300 android/apex-logo.svg -resize 512x512 android/app/src/main/res/drawable-nodpi/apex_logo.png
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
