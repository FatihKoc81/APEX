name: Import NEXORA starter ZIP
on:
  push:
    paths:
      - 'NEXORA-starter.zip'
      - '.nexora-import-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract starter project
        run: |
          test -f NEXORA-starter.zip
          mkdir -p /tmp/nexora
          unzip -o NEXORA-starter.zip -d /tmp/nexora
          cp -R /tmp/nexora/. .
          rm -f NEXORA-starter.zip
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/android.yml'
          if ! git diff --cached --quiet; then
            git commit -m "Import NEXORA starter project"
            git push
          fi
