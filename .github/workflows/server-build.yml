name: APEX Server TypeScript Check
on:
  push:
    branches: [main, apex/free-multi-provider]
    paths:
      - 'server/**'
      - '.github/workflows/server-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: server
        run: npm install
      - name: TypeScript build
        working-directory: server
        run: npm run build
