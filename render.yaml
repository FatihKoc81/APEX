services:
  - type: web
    name: apex-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_URL
        value: https://github.com/FatihKoc81/APEX
      - key: MAX_STEPS_PER_TASK
        value: 24
      - key: MAX_TASK_MINUTES
        value: 90
