services:
  - type: web
    name: apex-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 30000
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: FatihKoc81/APEX
      - key: GITHUB_BRANCH
        value: main
      - key: APEX_ENROLLMENT_CODE
        sync: false
      - key: APEX_ADMIN_TOKEN
        sync: false
      - key: MAX_STEPS_PER_TASK
        value: 50
      - key: MAX_TASK_MINUTES
        value: 180
      - key: MAX_PARALLEL_AGENTS
        value: 6

      - key: STUDIO_TIMEZONE
        value: Europe/Istanbul
      - key: STUDIO_TOPICS
        value: Tarih, teknoloji, genel kültür, otomobil, ilginç bilgiler
      - key: PIXABAY_API_KEY
        sync: false
      - key: CREATOMATE_API_KEY
        sync: false
      - key: CREATOMATE_TEMPLATE_ID
        sync: false
      - key: FREELLMAPI_BASE_URL
        sync: false
      - key: FREELLMAPI_API_KEY
        sync: false
      - key: FREELLMAPI_MODEL
        value: auto
      - key: NINEROUTER_BASE_URL
        sync: false
      - key: NINEROUTER_API_KEY
        sync: false
      - key: NINEROUTER_MODEL
        value: auto
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: STUDIO_WEBHOOK_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
